name: Build Android Debug Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Release `latest-debug` được dùng lại cho mọi lần build, nên không cho 2 lần chạy song song
# tranh nhau xoá asset / dời tag.
concurrency:
  group: release-debug
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare release assets
        run: |
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f MB", b / 1048576 }'; }

          cp app/build/outputs/apk/debug/app-debug.apk myquizapp-debug.apk
          apk=$(stat -c %s myquizapp-debug.apk)

          cat > release_notes.md <<EOF
          Commit: \`${GITHUB_SHA::7}\`

          Bản **debug** build tự động từ nhánh \`main\`, dùng để cài thử.

          | File | Dung lượng | Ghi chú |
          |---|---|---|
          | \`myquizapp-debug.apk\` | $(mb "$apk") | Chưa tối ưu (không minify), ký bằng debug keystore của runner. |

          > Mỗi lần build, debug keystore được tạo lại trên runner mới, nên khi cài đè lên bản build trước có thể bị báo xung đột chữ ký. Nếu gặp lỗi này hãy gỡ app cũ rồi cài lại.
          EOF
          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"

      # Release `latest-debug` được dùng lại, nên xoá asset của các lần build cũ.
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view latest-debug --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset latest-debug "$asset" -y
          done

      # Source zip/tar.gz của release được sinh từ tag, nên dời tag `latest-debug`
      # sang commit vừa build (action-gh-release không bao giờ dời tag đã tồn tại).
      - name: Move latest-debug tag to current commit
        run: |
          git tag -f latest-debug "$GITHUB_SHA"
          git push -f origin latest-debug

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: MyQuizApp Latest Debug Build
          body_path: release_notes.md
          prerelease: true
          files: myquizapp-debug.apk
